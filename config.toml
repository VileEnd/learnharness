[openrouter]
base_url = "https://openrouter.ai/api/v1"
ocr_model = "google/gemini-2.5-flash-lite"            # cheap carrier model for the file-parser plugin (ocr+vision only)
pdf_engine = "mistral-ocr"                             # used by strategy "ocr+vision"; "cloudflare-ai" is free but breaks math
vision_model = "deepseek/deepseek-v4.1-flash-1017"     # must accept images
vision_reasoning = { enabled = false }                 # thinking off: ~4x cheaper, same quality in tests; { effort = "low" } for very hard handwriting

[pipeline]
strategy = "vision"             # "vision": the vision model reads every page (~$0.0006/page)
                                # "ocr+vision": Mistral OCR for printed text + vision for figures/handwriting (~$0.003/page)
workers = 16                    # parallel API calls, shared by all PDFs in a run
dpi = 150                       # page render resolution for the vision model and the linked images
keep_all_page_images = false    # true keeps a PNG of every page, not only pages with figures or handwriting
ocr_price_per_page = 0.0021             # measured: Mistral OCR + carrier model
vision_price_per_page = 0.0006          # measured: deepseek-v4.1-flash, thinking off
vision_thinking_price_per_page = 0.0025 # measured: same with effort "low"
