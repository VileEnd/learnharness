# LearnHarness self-hosted stack (docs/self-hosting.md).
#
#   browser ──HTTPS──▶ caddy ──forward_auth──▶ oauth2-proxy ──OIDC──▶ keycloak
#                        └──────────────────────▶ learnharness (no auth of its own) ──▶ ocr (internal, token)
#
# Only Caddy publishes ports. Hostnames come from .env (see .env.example).
name: learnharness

services:
  learnharness:
    build: ..
    image: learnharness:local
    restart: unless-stopped
    volumes:
      # /data/data = LH_DATA_DIR (chats, graph, settings), /data/auth.json = API keys.
      # The entrypoint hands the files to the app user (uid 1000) on start.
      - ./volumes/learnharness:/data
    environment:
      # PDF scanning sidecar (services/ocr): internal only, shared secret on every call.
      OCR_URL: http://ocr:8000
      OCR_TOKEN: ${OCR_TOKEN}
      # Per-user data under users/<keycloak sub>/ (docs/self-hosting.md).
      LH_MULTI_USER: "1"
      # Sidebar "Sign out" ends the Keycloak session too, so switching users works.
      LH_HOST: ${LH_HOST}
      LH_LOGOUT_URL: ${AUTH_URL}/realms/learnharness/protocol/openid-connect/logout
      # Admin Users section: Keycloak service-account client (learnharness-admin-api); empty secret disables it.
      KC_ADMIN_API_URL: http://keycloak:8080
      KC_ADMIN_API_SECRET: ${KC_ADMIN_API_SECRET:-}
      # Claude Code (admin, experimental): the runner in the claude service, reached on the private claude-bridge network.
      CLAUDE_RUNNER_ADDR: 172.30.66.3:8790
      CLAUDE_RUNNER_TOKEN: ${CLAUDE_RUNNER_TOKEN:?set CLAUDE_RUNNER_TOKEN in .env}
      CLAUDE_BRIDGE_HOST: 172.30.66.2
    networks:
      internal:
      claude-bridge:
        ipv4_address: 172.30.66.2

  claude:
    # The Claude Code CLI behind a TCP runner (claude/runner.mjs). Locked down:
    # no /data, no app secrets, non-root, read-only. It reaches the app only
    # over claude-bridge (internal, no internet) and api.anthropic.com over
    # claude-egress. The login lives in volumes/claude: never back it up.
    build: ./claude
    image: learnharness-claude:local
    restart: unless-stopped
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    mem_limit: 2g
    environment:
      CLAUDE_RUNNER_TOKEN: ${CLAUDE_RUNNER_TOKEN:?set CLAUDE_RUNNER_TOKEN in .env}
      CLAUDE_RUNNER_LISTEN: 172.30.66.3:8790
      LH_APP_HOST: 172.30.66.2
      CLAUDE_CONFIG_DIR: /claude
      DISABLE_AUTOUPDATER: "1"
      HOME: /home/node
    volumes:
      # Owned by uid 1000, mode 0700 (the NixOS module does this).
      - ./volumes/claude:/claude
    networks:
      claude-bridge:
        ipv4_address: 172.30.66.3
      claude-egress:

  ocr:
    # PDF -> markdown service (services/ocr). No published port and no Caddy route:
    # only the app reaches it, with the OCR_TOKEN header. The OpenRouter key comes
    # per request from the app's settings; /data holds out/ (results) and cache/.
    build: ../services/ocr
    image: learnharness-ocr:local
    restart: unless-stopped
    environment:
      OCR_TOKEN: ${OCR_TOKEN:?set OCR_TOKEN in .env}
    volumes:
      - ./volumes/ocr:/data
    networks: [internal]

  caddy:
    # caddy:2.11.7 + the Cloudflare DNS plugin (caddy/Dockerfile).
    build: ./caddy
    image: learnharness-caddy:local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      LH_HOST: ${LH_HOST:?set LH_HOST in .env}
      AUTH_SITE: ${AUTH_SITE:?set AUTH_SITE in .env}
      CADDY_TLS: ${CADDY_TLS:-internal}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./caddy:/etc/caddy:ro
      # Holds the local CA (caddy/pki/authorities/local/root.crt) — back it up;
      # devices trust this root once.
      - ./volumes/caddy/data:/data
      - ./volumes/caddy/config:/config
    networks: [internal]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # Tokens carry the PUBLIC issuer (Keycloak's KC_HOSTNAME) and are checked
      # against it. The browser logs in at the public URL; oauth2-proxy itself
      # talks to Keycloak over the internal network (no TLS/CA, no LAN DNS).
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${AUTH_URL:?set AUTH_URL in .env}/realms/learnharness
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: ${AUTH_URL}/realms/learnharness/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/learnharness/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/learnharness/protocol/openid-connect/certs
      OAUTH2_PROXY_PROFILE_URL: http://keycloak:8080/realms/learnharness/protocol/openid-connect/userinfo
      OAUTH2_PROXY_VALIDATE_URL: http://keycloak:8080/realms/learnharness/protocol/openid-connect/userinfo
      OAUTH2_PROXY_CLIENT_ID: learnharness
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # Groups arrive through the client's group-membership mapper, not a scope.
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_ALLOWED_GROUPS: learnharness
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REDIRECT_URL: https://${LH_HOST}/oauth2/callback
      # AUTH_SITE: sign-out may redirect (rd=) to Keycloak's end-session endpoint.
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${LH_HOST},${AUTH_SITE}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      # Rolling login: the session is refreshed (via Keycloak) every hour while
      # the app is used, and ends after 30 days without use (also the realm's
      # SSO idle timeout, deploy/keycloak/realm-learnharness.json).
      OAUTH2_PROXY_COOKIE_EXPIRE: 720h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # X-Auth-Request-User carries the stable Keycloak sub, not the username.
      OAUTH2_PROXY_USER_ID_CLAIM: sub
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
    depends_on: [keycloak]
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    # The realm (client, group, mappers) is imported on first start only.
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KC_HOSTNAME: ${AUTH_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?set KC_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}
      # Substituted into the realm file at import.
      LH_HOST: ${LH_HOST}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm-learnharness.json:/opt/keycloak/data/import/realm-learnharness.json:ro
    depends_on: [keycloak-db]
    networks: [internal]

  keycloak-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./volumes/keycloak-db:/var/lib/postgresql/data
    networks: [internal]

networks:
  internal:
  # Private link between the app and the claude runner: no route out.
  claude-bridge:
    internal: true
    ipam:
      config:
        - subnet: 172.30.66.0/29
  # Plain bridge so the claude service can reach api.anthropic.com.
  claude-egress:
