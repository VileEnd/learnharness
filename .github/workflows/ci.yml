name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  ocr:
    name: OCR service (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install './services/ocr[dev]'
      # No network: the tests stub OpenRouter.
      - run: python -m pytest -q
        working-directory: services/ocr
      # Host-side deploy scripts (wg-apply.py); stdlib only.
      - run: python3 -I -B -m unittest discover -s tests/deploy -v

  docker:
    name: Docker image (build + boot)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The build itself runs the standalone gates (provider runtime, payload
      # curation, server boot smoke) and the image's Chromium demo probe.
      - run: docker build -t learnharness:ci .
      - name: Boot the image and probe the GET-only API
        run: |
          set -euo pipefail
          docker run -d --name lh -p 127.0.0.1:3000:3000 learnharness:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          for route in / /api/graph /api/models /api/settings /manifest.webmanifest; do
            curl -fsS -o /dev/null -w "%{http_code} $route\n" "http://127.0.0.1:3000$route"
          done
      - name: Build the OCR service image, boot it and probe /healthz
        run: |
          set -euo pipefail
          docker build -t learnharness-ocr:ci services/ocr
          docker run -d --name ocr -e OCR_TOKEN=ci -p 127.0.0.1:8000:8000 learnharness-ocr:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/runs)" = 401
          curl -fsS -H 'X-OCR-Token: ci' http://127.0.0.1:8000/api/runs
      - if: failure()
        run: |
          docker logs lh || true
          docker logs ocr || true
