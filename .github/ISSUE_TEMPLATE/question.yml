name: Question
description: Ask about using or self-hosting LearnHarness.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        **This report is public.** Do not include API keys, `auth.json` contents or private information.
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Include any relevant context. Version, browser, provider or model details can help when they relate to your question.
    validations:
      required: true
